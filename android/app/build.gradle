// The app shell (android/README.md). Native libraries are built by ../build_native.py, not by Gradle: the recompiled
// game is large and is lifted on the PC first. SDL's Java side comes straight from the SDL source tree.
apply plugin: 'com.android.application'

def repo = rootProject.file('..')
def sdl2 = file(project.findProperty('sdl2.dir') ?: System.getenv('SDL2_SOURCE') ?: "${repo}/build/deps/SDL2")
def nativeOut = file(project.findProperty('native.dir') ?: "${repo}/build/android")

android {
    namespace 'local.newdarkandroid.ss2'
    compileSdk 34
    ndkVersion '29.0.14206865'           // only to strip the prebuilt libraries' debug info when packaging

    defaultConfig {
        applicationId 'local.newdarkandroid.ss2'
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName '0.8.0-phase4'
        ndk { abiFilters 'arm64-v8a' }
    }

    // Two builds of the same app (same package: one replaces the other and keeps its data):
    //   dev  - everything: the game, the headless game, the conformance programs and their guest (diagnostics, tests)
    //   play - what playing needs: the game and SDL (about half the size); the launcher hides the diagnostics
    buildFeatures { buildConfig true }
    flavorDimensions 'kind'
    productFlavors {
        dev { dimension 'kind'; buildConfigField 'boolean', 'DIAGNOSTICS', 'true' }
        play { dimension 'kind'; versionNameSuffix '-play'; buildConfigField 'boolean', 'DIAGNOSTICS', 'false' }
    }

    sourceSets {
        main {
            java.srcDirs += "${sdl2}/android-project/app/src/main/java"
            jniLibs.srcDirs = ["${nativeOut}/libs"]
        }
        dev { assets.srcDirs = ["${nativeOut}/assets"] }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint { abortOnError false }
}

androidComponents {
    onVariants(selector().all()) { v ->
        if (v.flavorName == 'play')
            ['libss2null.so', 'libss2conf.so', 'libss2conf_cr.so'].each { v.packaging.jniLibs.excludes.add("**/${it}") }
    }
}

tasks.register('checkNativeInputs') {
    doLast {
        if (!file("${sdl2}/android-project/app/src/main/java/org/libsdl/app/SDLActivity.java").exists())
            throw new GradleException("SDL 2 source not found at ${sdl2}: set SDL2_SOURCE or -Psdl2.dir")
        if (!file("${nativeOut}/libs/arm64-v8a/libSDL2.so").exists())
            throw new GradleException("native libraries not built: run python android/build_native.py first")
    }
}
preBuild.dependsOn checkNativeInputs
